(function() {
    for (const [relPath, entry] of Object.entries(ASSET_MANIFEST)) {
        const byteString = atob(entry.b64);
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
        const blob = new Blob([ab], { type: entry.mime });
        ASSET_URLS[relPath] = URL.createObjectURL(blob);
    }
})();

class AmbientPipeline extends Phaser.Renderer.WebGL.Pipelines.PostFXPipeline {
    constructor(game) {
        super({
            game,
            fragShader: `
                #define PHASER_PIPELINE_SAMPLER2D
                precision mediump float;
                uniform sampler2D uMainSampler;
                varying vec2 outTexCoord;
                void main() {
                    vec4 c = texture2D(uMainSampler, outTexCoord);
                    float r = 0.489569548 * c.r + 0.139788114 * c.g + 0.014106449 * c.b + 0.100392157;
                    float g = 0.041569548 * c.r + 0.587788114 * c.g + 0.014106449 * c.b + 0.100392157;
                    float b = 0.065388700 * c.r + 0.219886034 * c.g + 0.470189377 * c.b + 0.100392157;
                    gl_FragColor = vec4(clamp(vec3(r, g, b), 0.0, 1.0), c.a);
                }
            `
        });
    }
}

    createAnim({ key: 'archer-run', frames: this.anims.generateFrameNumbers('archer', { start: 0, end: 3 }), frameRate: 10, repeat: -1 });

            this.physics.add.overlap(king, enemies, hitKing, null, this);

function makeCanvasTexture(scene, key, width, height, draw, smooth) {
    if (scene.textures.exists(key)) scene.textures.remove(key);
    const texture = scene.textures.createCanvas(key, width, height);
    draw(texture.getContext(), width, height);
    texture.refresh();
    texture.setFilter(smooth
        ? Phaser.Textures.FilterMode.LINEAR
        : Phaser.Textures.FilterMode.NEAREST);
    return texture;
}

function makeTileStrip(scene, key, frames) {
    const tileTexture = scene.textures.get('bg-tiles');
    makeCanvasTexture(scene, key, frames.length * 32, 32, (ctx) => {
        ctx.imageSmoothingEnabled = false;
        frames.forEach((frameIndex, i) => {
            const frame = tileTexture.get(frameIndex);
            ctx.drawImage(
                frame.source.image,
                frame.cutX, frame.cutY, 32, 32,
                i * 32, 0, 32, 32
            );
        });
    });
}

function createBackground(scene) {
    const rng = new Phaser.Math.RandomDataGenerator(['stalking-fields']);
    fogClouds.length = 0;

    makeCanvasTexture(scene, 'bg-sky', GAME_WIDTH, 600, (ctx, w, h) => {
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0.00, '#6a6d55');
        g.addColorStop(0.50, '#6a6d55');
        g.addColorStop(1.00, '#999d7c');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
    }, true);
    skyImg = scene.add.image(0, 0, 'bg-sky')
        .setOrigin(0).setScrollFactor(0, 0).setDepth(DEPTH.SKY)
        .setScale(1 / CAMERA_ZOOM, 1 / CAMERA_ZOOM);

    makeCanvasTexture(scene, 'bg-sun-glow', 256, 256, (ctx, w, h) => {
        const glow = ctx.createRadialGradient(w / 2, h / 2, 2, w / 2, h / 2, w / 2);
        glow.addColorStop(0.00, 'rgba(255, 239, 190, 0.85)');
        glow.addColorStop(0.22, 'rgba(255, 220, 148, 0.32)');
        glow.addColorStop(0.55, 'rgba(255, 200, 120, 0.10)');
        glow.addColorStop(1.00, 'rgba(255, 190, 110, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);
    }, true);
    scene.add.image(560, 250, 'bg-sun-glow')
        .setDisplaySize(330, 330).setScrollFactor(0.10, 1)
        .setDepth(DEPTH.SUNMOON).setBlendMode(Phaser.BlendModes.ADD).setAlpha(0.8);
    scene.add.sprite(560, 250, 'bg-sunmoon', 0)
        .setScale(2).setScrollFactor(0.10, 1).setTint(0xffe6ae).setDepth(DEPTH.SUNMOON + 1);

    const skylineScale = 1.5;
    const skylineHeight = 192 * skylineScale;
    const BACKDROP_SINK = 12;
    const BACKDROP_DROP = 114;
    const BACKDROP_RAISE_SCREEN = 10;
    const SKYLINE_TILE_OFFSET_Y = 2;
    const skylineY = GROUND_SURFACE_Y - skylineHeight + BACKDROP_SINK + BACKDROP_DROP
        - BACKDROP_RAISE_SCREEN / CAMERA_ZOOM
        + SKYLINE_TILE_OFFSET_Y * skylineScale;
    scene.add.tileSprite(0, skylineY, 2400, skylineHeight, 'bg-skyline-hills')
        .setOrigin(0).setTileScale(skylineScale).setTilePosition(0, SKYLINE_TILE_OFFSET_Y)
        .setScrollFactor(0.15, 1)
        .setTint(0x717565).setAlpha(0.8).setDepth(DEPTH.BACKDROP_FAR);
    scene.add.tileSprite(0, skylineY, 2400, skylineHeight, 'bg-skyline-trees')
        .setOrigin(0).setTileScale(skylineScale).setTilePosition(0, SKYLINE_TILE_OFFSET_Y)
        .setScrollFactor(0.30, 1)
        .setTint(0x555849).setAlpha(0.94).setDepth(DEPTH.BACKDROP_CLOSE);

    makeCanvasTexture(scene, 'bg-haze', GAME_WIDTH, 600, (ctx, w, h) => {
        const haze = ctx.createLinearGradient(0, 0, 0, h);
        haze.addColorStop(0.00, 'rgba(153, 157, 124, 0)');
        haze.addColorStop(1.00, 'rgba(153, 157, 124, 1)');
        ctx.fillStyle = haze;
        ctx.fillRect(0, 0, w, h);
    }, true);
    hazeImg = scene.add.image(0, 0, 'bg-haze')
        .setOrigin(0).setScrollFactor(0, 1).setDepth(DEPTH.HAZE)
        .setScale(1 / CAMERA_ZOOM, 1 / CAMERA_ZOOM);

    makeCanvasTexture(scene, 'bg-ground-backing', 64, GROUND_ROW_HEIGHT, (ctx, w, h) => {
        const backing = ctx.createLinearGradient(0, 0, 0, h);
        backing.addColorStop(0.00, 'rgba(58, 45, 34, 0)');
        backing.addColorStop(0.22, '#3a2d22');
        backing.addColorStop(1.00, '#2a201a');
        ctx.fillStyle = backing;
        ctx.fillRect(0, 0, w, h);
    });
    scene.add.tileSprite(0, GROUND_SURFACE_Y + 8, 2400, GROUND_ROW_HEIGHT, 'bg-ground-backing')
        .setOrigin(0).setScrollFactor(1, 1).setDepth(DEPTH.TERRAIN - 1);

    const groundSegments = [
        { count: 3, frames: [1, 3, 2] },
        { count: 15, frames: [7, 8, 9, 10, 17, 18] },
        { count: 10, frames: [11, 12, 13, 14, 15, 16] },
        { count: 12, frames: [17, 10, 8, 9, 10, 9, 8, 18] },
        { count: 7, frames: [11, 15, 12, 16, 15, 13, 14] },
        { count: 3, frames: [2, 4, 5] }
    ];
    const groundFrames = [];
    groundSegments.forEach((segment, segmentIndex) => {
        for (let i = 0; i < segment.count; i++) {
            groundFrames.push(segment.frames[(i + segmentIndex) % segment.frames.length]);
        }
    });
    makeTileStrip(scene, 'bg-ground-unified', groundFrames);
    scene.add.image(0, GROUND_SURFACE_Y, 'bg-ground-unified')
        .setOrigin(0).setScale(GROUND_TILE_SCALE).setScrollFactor(1, 1)
        .setDepth(DEPTH.TERRAIN);

    const REED_RAISE_SCREEN = 10;
    const REED_HIDE_Y = GROUND_SURFACE_Y + 6 - REED_RAISE_SCREEN / CAMERA_ZOOM;
    const REED_SRC_HEIGHT = 32;
    const addReedLayer = (count, scaleMin, scaleMax, tint, alpha, depth) => {
        const step = 2400 / count;
        for (let i = 0; i < count; i++) {
            const x = i * step + rng.realInRange(-step * 0.3, step * 0.3);
            const scale = rng.realInRange(scaleMin, scaleMax);
            const baseY = REED_HIDE_Y + (REED_SRC_HEIGHT * scale) / 2
                + rng.realInRange(-2, 2);
            const reed = scene.add.sprite(x, baseY, 'bg-reed')
                .setOrigin(0.5, 1)
                .setScale(scale)
                .setScrollFactor(1, 1)
                .setTint(tint).setAlpha(alpha).setDepth(depth);
            if (scene.anims && scene.anims.exists('bg-reed-sway')) {
                reed.play('bg-reed-sway');
                if (reed.anims) reed.anims.setProgress(rng.frac());
            }
        }
    };
    addReedLayer(20, 0.9, 1.3, 0x96977a, 0.8, DEPTH.REED - 1);
    addReedLayer(18, 1.1, 1.6, 0xa5a583, 0.9, DEPTH.REED);

    const treeScale = 1.5;
    const treeBottom = GROUND_SURFACE_Y + GROUND_ROW_HEIGHT;
    scene.add.image(0, treeBottom, 'bg-treeline')
        .setOrigin(0, 1).setScale(treeScale).setFlipX(true)
        .setScrollFactor(1, 1).setDepth(DEPTH.PROPS_WALLS).setAlpha(0.98);
    scene.add.image(2400, treeBottom, 'bg-treeline')
        .setOrigin(1, 1).setScale(treeScale)
        .setScrollFactor(1, 1).setDepth(DEPTH.PROPS_WALLS).setAlpha(0.98);

    for (let i = 0; i < FOG_MAX; i++) {
        const sfx = Math.random() < 0.5 ? 1.5 : 2.5;
        const flip = Math.random() < 0.5;
        const frame = Math.floor(Math.random() * 4);

        const fog = scene.add.sprite(0, 0, 'bg-fog', frame)
            .setOrigin(0, 0)
            .setScale(FOG_SCALE_X, FOG_SCALE_Y)
            .setScrollFactor(sfx, FOG_PARALLAX_Y)
            .setFlipX(flip)
            .setDepth(DEPTH.FOG_EDGE)
            .setVisible(false)
            .setActive(false);

        fog.fogSfx = sfx;
        fog.fogFlip = flip;
        fog.fogFrame = frame;
        fog.fogAlive = false;
        fogClouds.push(fog);
    }

    const waterTop = WATER_EDGE_Y;
    const waterHeight = WATER_HEIGHT;
    const waterWidth = 512;
    makeCanvasTexture(scene, 'bg-water-base', waterWidth, waterHeight, (ctx, w, h) => {
        const water = ctx.createLinearGradient(0, 0, 0, h);
        water.addColorStop(0.00, '#78806b');
        water.addColorStop(0.18, '#55604f');
        water.addColorStop(0.45, '#374434');
        water.addColorStop(0.72, '#1e2a1f');
        water.addColorStop(1.00, '#0b130e');
        ctx.fillStyle = water;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(30, 40, 30, 0.28)';
        ctx.fillRect(0, 0, w, 1);
        ctx.fillStyle = 'rgba(150, 170, 145, 0.10)';
        ctx.fillRect(0, 1, w, 1);
    });
    scene.add.image(0, waterTop, 'bg-water-base')
        .setOrigin(0, 0).setScrollFactor(0, 1)
        .setDisplaySize(2400, waterHeight)
        .setDepth(DEPTH.WATER);

    makeCanvasTexture(scene, 'bg-water', waterWidth, waterHeight, (ctx, w, h) => {
        const rippleRng = new Phaser.Math.RandomDataGenerator(['water-ripples']);
        for (let y = 6; y < h - 8; y += 3) {
            for (let x = 0; x < w; x += 4) {
                const wave = Math.sin((x / w) * Math.PI * 2 * 6 + y * 0.45)
                    + 0.55 * Math.sin((x / w) * Math.PI * 2 * 13 - y * 0.31);
                if (wave > 0.85) {
                    ctx.fillStyle = `rgba(150, 190, 180, ${rippleRng.realInRange(0.10, 0.26)})`;
                    ctx.fillRect(x, y, 4, 1);
                } else if (wave < -1.15) {
                    ctx.fillStyle = `rgba(15, 35, 32, ${rippleRng.realInRange(0.08, 0.20)})`;
                    ctx.fillRect(x, y, 4, 1);
                }
            }
        }
        for (let i = 0; i < 18; i++) {
            const baseX = rippleRng.between(0, w - 1);
            const length = rippleRng.between(9, 26);
            const tint = rippleRng.frac() < 0.5
                ? 'rgba(15, 32, 30, 0.24)'
                : 'rgba(95, 125, 118, 0.14)';
            ctx.fillStyle = tint;
            for (let y = 6; y < length; y += 2) {
                const x = (baseX + Math.round(Math.sin(y * 0.45 + i) * 3) + w) % w;
                ctx.fillRect(x, y, 2, 2);
            }
        }
    });
    const water = scene.add.tileSprite(0, waterTop, 2400, waterHeight, 'bg-water')
        .setOrigin(0, 0).setScrollFactor(0, 1).setDepth(DEPTH.WATER + 1);
    scene.tweens.add({
        targets: water, tilePositionX: 512,
        duration: 22000, repeat: -1, ease: 'Linear'
    });
    waterUpdate = () => {
        const t = scene.time.now * 0.0008;
        water.tilePositionX += Math.sin(t) * 0.4 + 0.6;
        water.tilePositionY = Math.sin(t * 0.6) * 1.2;
    };

function updateWaterReflection(time) {
    if (!reflectionRT || !reflectionRT.texture) return;
    const cam = scene.cameras.main;
    reflectionObjects.length = 0;
    const children = scene.children.list;
    for (let i = 0; i < children.length; i++) {
        const o = children[i];
        if (!o || o === reflectionRT) continue;
        if (o.depth === undefined || o.depth >= DEPTH.WATER) continue;
        if (!o.visible || o.alpha <= 0) continue;
        reflectionObjects.push(o);
    }
    reflectionObjects.sort((a, b) => a.depth - b.depth);

    const t = time * 0.001;
    reflectionRT.clear();
    reflectionRT.beginDraw();
    for (let i = 0; i < reflectionObjects.length; i++) {
        const o = reflectionObjects[i];
        const sfx = o.scrollFactorX === undefined ? 1 : o.scrollFactorX;
        const sfy = o.scrollFactorY === undefined ? 1 : o.scrollFactorY;
        let x = o.x + cam.scrollX * (1 - sfx);
        let y = o.y + cam.scrollY * (1 - sfy) - WATER_CAPTURE_TOP;
        x += Math.sin(t * 1.6 + o.y * 0.09) * 1.2
            + Math.sin(t * 0.7 + o.x * 0.03) * 0.6;
        y += Math.sin(t * 2.1 + o.x * 0.06) * 0.8;
        reflectionRT.batchDraw(o, x, y);
    }
    reflectionRT.endDraw();
}

function screenToWorldX(screenX, sfx) {
    const cam = scene.cameras.main;
    return cam.scrollX * sfx
        + (screenX + GAME_WIDTH * (CAMERA_ZOOM - 1) / 2) / CAMERA_ZOOM;
}

function screenToWorldY(screenY, sfy) {
    const cam = scene.cameras.main;
    const h = scene.scale.height;
    return cam.scrollY * sfy
        + (screenY + h * (CAMERA_ZOOM - 1) / 2) / CAMERA_ZOOM;
}

function fogScreenX(fog) {
    const cam = scene.cameras.main;
    return (fog.x - cam.scrollX * fog.scrollFactorX) * CAMERA_ZOOM
        - GAME_WIDTH * (CAMERA_ZOOM - 1) / 2;
}

function fogScreenY(fog) {
    const cam = scene.cameras.main;
    return (fog.y - cam.scrollY * fog.scrollFactorY) * CAMERA_ZOOM
        - scene.scale.height * (CAMERA_ZOOM - 1) / 2;
}

function stepFog(elapsed) {
    fogT += elapsed;
    if (fogT - fogChanged > FOG_TICK) fogChanged = fogT;

    for (let i = 0; i < fogClouds.length; i++) {
        const fog = fogClouds[i];
        if (!fog.fogAlive) continue;

        const sx = fogScreenX(fog);
        if (sx + FOG_W < FOG_KILL_LEFT ||
            sx > FOG_KILL_RIGHT) {
            fog.fogAlive = false;
            fog.setActive(false).setVisible(false);
        } else {
            fog.x -= FOG_DRIFT_WORLD * elapsed;
        }
    }

    if (fogChanged > fogWeatherChanged) {
        if (fogClouds.filter((f) => f.fogAlive).length < FOG_MAX * FOG_FOG) {
            const dead = fogClouds.find((f) => !f.fogAlive);
            if (dead) spawnFog(dead);
        }
        fogWeatherChanged = fogT;
    }
}

function updateFog(delta) {
    fogStepAccum = Math.min(fogStepAccum + delta / 1000, FOG_MAX_DT);
    while (fogStepAccum >= FOG_SOURCE_STEP) {
        fogStepAccum -= FOG_SOURCE_STEP;
        stepFog(FOG_SOURCE_STEP);
    }
}

function spawnFog(fog) {
    const sfx = fog.fogSfx;
    const left = Math.random() < 0.5;

    const screenX = left ? -FOG_W : GAME_WIDTH;
    const screenY = FOG_SPAWN_TOP + Math.random() * FOG_SPAWN_RANGE;

    fog.x = screenToWorldX(screenX, sfx);
    fog.y = screenToWorldY(screenY, FOG_PARALLAX_Y);

    fog.setTint(FOG_TINT);
    fog.setAlpha(FOG_ALPHA);
    fog.fogAlive = true;
    fog.setActive(true).setVisible(true);
}

function layoutScreenSpaceLayers() {
    const cam = scene.cameras.main;
    if (!cam) return;

    if (skyImg) {
        skyImg.x = screenToWorldX(0, 0);
        skyImg.y = screenToWorldY(0, 0);

    if (hazeImg) {
        hazeImg.x = screenToWorldX(0, 0);
        hazeImg.y = screenToWorldY(-0.2 * 600, FOG_PARALLAX_Y);
    }
    if (darknessImg) {
        darknessImg.x = screenToWorldX(0, 0);
        darknessImg.y = screenToWorldY(0, 0);
    }
    if (noiseImg) {
        noiseImg.x = screenToWorldX(0, 0);
        noiseImg.y = screenToWorldY(0, 0);
    }
}

function killProjectile(p) {
    if (!p || !p.active) return;

    p.destroy();
}

let masterVolume = (() => {
    try {
        const v = localStorage.getItem('kingdom-volume');
        if (v === null) return 0.5;
        const n = Number(v);
        return isNaN(n) ? 0.5 : Math.max(0, Math.min(1, n));
    } catch(e) { return 0.5; }
})();
let isMuted = (() => {
    try {
        return localStorage.getItem('kingdom-muted') === '1';
    } catch(e) { return false; }
})();

function setVolume(v) {
    masterVolume = Math.max(0, Math.min(1, Number(v) / 100));
    try { localStorage.setItem('kingdom-volume', String(masterVolume)); } catch(e) {}
    if (scene && scene.sound) {
        scene.sound.volume = isMuted ? 0 : masterVolume;
    }
}

function toggleMute() {
    isMuted = !isMuted;
    try { localStorage.setItem('kingdom-muted', isMuted ? '1' : '0'); } catch(e) {}
    if (scene && scene.sound) {
        scene.sound.mute = isMuted;
        if (isMuted) {
            scene.sound.volume = 0;
        } else {
            scene.sound.volume = masterVolume;
        }
    }
    const btn = document.getElementById('muteBtn');
    if (btn) btn.textContent = isMuted ? 'Звук: выкл' : 'Звук: вкл';
}

function playSound(key, volume, rate) {
    if (!scene || !scene.sound) return;
    try {
        const cfg = { volume: (volume === undefined ? 0.5 : volume) * (isMuted ? 0 : masterVolume) };
        if (rate !== undefined) cfg.rate = rate;
        scene.sound.play(key, cfg);
    } catch (e) {
        console.warn('Не удалось проиграть звук', key, e);
    }
}

function solveLaunchAngle(fromX, fromY, targetX, targetY) {
    const dx = targetX - fromX;
    const dyUp = fromY - targetY;
    const v2 = PROJECTILE_SPEED * PROJECTILE_SPEED;
    if (dx <= 0) {
        return Math.atan2(targetY - fromY, dx) - 0.1;
    }
    const disc = v2 * v2 - PROJECTILE_GRAVITY * (PROJECTILE_GRAVITY * dx * dx + 2 * dyUp * v2);
    if (disc < 0) {
        return Math.atan2(targetY - fromY, dx) - 0.12;
    }
    return -Math.atan((v2 - Math.sqrt(disc)) / (PROJECTILE_GRAVITY * dx));
}

function solveHighLaunchAngle(fromX, fromY, targetX, targetY) {
    const dx = targetX - fromX;
    if (dx <= 0) return null;
    const dyUp = fromY - targetY;
    const v2 = PROJECTILE_SPEED * PROJECTILE_SPEED;
    const disc = v2 * v2 - PROJECTILE_GRAVITY * (PROJECTILE_GRAVITY * dx * dx + 2 * dyUp * v2);
    if (disc < 0) return null;
    return -Math.atan((v2 + Math.sqrt(disc)) / (PROJECTILE_GRAVITY * dx));
}

function trajectoryYAt(x0, y0, angle, x) {
    const vx = Math.cos(angle) * PROJECTILE_SPEED;
    if (vx <= 1) return Infinity;
    const t = (x - x0) / vx;
    return y0 + Math.sin(angle) * PROJECTILE_SPEED * t + 0.5 * PROJECTILE_GRAVITY * t * t;
}

function findBlockingWall(fromX, toX) {
    let best = null;
    walls.children.iterate((w) => {
        if (!w || !w.active || !w.body || !w.body.enable) return;
        const cx = w.body.center.x;
        if (cx <= fromX + 2 || cx >= toX) return;
        if (!best || cx < best.body.center.x) best = w;
    });
    return best;
}

function clearsWall(x0, y0, angle, wall) {
    const l = Math.max(wall.body.left, x0 + 2);
    const r = wall.body.right;
    if (r <= x0 + 2) return true;
    const top = wall.body.top;
    return trajectoryYAt(x0, y0, angle, l) < top - 2 && trajectoryYAt(x0, y0, angle, r) < top - 2;
}

function clearanceAngle(x0, y0, wall) {
    for (let deg = 10; deg <= 85; deg += 1) {
        const a = -deg * Math.PI / 180;
        if (clearsWall(x0, y0, a, wall)) return a;
    }
    return -Math.PI / 3;
}

function solveLobAngle(fromX, fromY, targetX, targetY, targetVx) {
    let aimX = targetX;
    let angle = solveHighLaunchAngle(fromX, fromY, aimX, targetY);
    if (angle === null) return null;
    for (let i = 0; i < 3; i++) {
        const flight = Math.abs(aimX - fromX) / (PROJECTILE_SPEED * Math.max(0.2, Math.cos(angle)));
        aimX = targetX + (targetVx || 0) * flight;
        angle = solveHighLaunchAngle(fromX, fromY, aimX, targetY);
        if (angle === null) return null;
    }
    return angle;
}

function computeAimAngle(fromX, fromY, targetX, targetY, targetVx, lobOverWall) {
    const tVx = targetVx || 0;
    let aimX = targetX;
    let angle = solveLaunchAngle(fromX, fromY, aimX, targetY);
    for (let i = 0; i < 3; i++) {
        const flight = Math.abs(aimX - fromX) / (PROJECTILE_SPEED * Math.max(0.2, Math.cos(angle)));
        aimX = targetX + tVx * flight;
        angle = solveLaunchAngle(fromX, fromY, aimX, targetY);
    }
    if (lobOverWall) {
        const wall = findBlockingWall(fromX, aimX);
        if (wall && !clearsWall(fromX, fromY, angle, wall)) {
            const jitter = Phaser.Math.Between(-10, 10);
            const lob = solveLobAngle(fromX, fromY, aimX + jitter, targetY, tVx);
            if (lob !== null && clearsWall(fromX, fromY, lob, wall)) return lob;
            return clearanceAngle(fromX, fromY, wall);
        }
    }
    return angle + Phaser.Math.FloatBetween(-0.18, 0.12);
}

function spawnProjectile(x, y, angle, source, speed) {
    if (projectiles.countActive() >= MAX_PROJECTILES) return null;
    const v = speed === undefined ? PROJECTILE_SPEED : speed;
    const p = scene.add.ellipse(x, y, PROJECTILE_W, PROJECTILE_H, 0x000000);
    p.setDepth(DEPTH.FX_LIGHTS);
    scene.physics.add.existing(p);
    projectiles.add(p);
    p.body.setAllowGravity(true);
    p.body.setGravityY(PROJECTILE_GRAVITY);
    p.body.setVelocity(
        Math.cos(angle) * v,
        Math.sin(angle) * v
    );
    p.source = source;
    return p;
}

function dropCoin(x) {

}

function findNearestEnemy(x, y, range) {
    let nearest = null, minDist = range;
    enemies.children.iterate((e) => {
        if (!e || !e.active) return;
        const d = Phaser.Math.Distance.Between(x, y, e.x, e.y);
        if (d < minDist) { minDist = d; nearest = e; }
    });
    return nearest;
}

function collectCoin(king, coin) {
    if (!coin.active) return;
    coin.body.enable = false;
    coin.destroy();
    coinBalance += 1;
    document.getElementById('coinCount').textContent = coinBalance;
    playSound('pickup', 0.45);
}

function findFreeArcherX(preferredX) {
    const isFree = (x) => {
        if (x - ARCHER_RADIUS < 0 || x + ARCHER_RADIUS > 2400) return false;
        if (Math.abs(x - king.x) < STALKER_BODY_HALF + ARCHER_RADIUS + 2) return false;
        for (const w of walls.getChildren()) {
            if (!w || !w.active || !w.body || !w.body.enable) continue;
            const gap = x <= w.body.center.x ? ARCHER_WALL_GAP : ARCHER_WALL_FRONT_GAP;
            if (x + ARCHER_RADIUS + gap > w.body.left &&
                x - ARCHER_RADIUS - gap < w.body.right) return false;
        }
        for (const o of archers.getChildren()) {
            if (!o || !o.active) continue;
            if (Math.abs(x - o.x) < ARCHER_MIN_SPACING) return false;
        }
        return true;
    };

    if (isFree(preferredX)) return preferredX;
    for (let step = 1; step <= 60; step++) {
        const left = preferredX - step * ARCHER_MIN_SPACING;
        if (left - ARCHER_RADIUS < 0) break;
        if (isFree(left)) return left;
    }
    for (let step = 1; step <= 60; step++) {
        const right = preferredX + step * ARCHER_MIN_SPACING;
        if (right + ARCHER_RADIUS > 2400) break;
        if (isFree(right)) return right;
    }
    return preferredX;
}

function hireArcher() {
    if (archers.countActive() >= 10) return;
    if (coinBalance < ARCHER_COST) return;
    coinBalance -= ARCHER_COST;
    const spawnX = findFreeArcherX(king.x - ARCHER_SPAWN_OFFSET);
    const archer = archers.create(spawnX, ARCHER_Y, 'archer');
    archer.play('archer-idle');
    archer.setFlipX(true);
    archer.setDepth(DEPTH.UNITS);
    archer.setCircle(9, 7, 14);
    archer.body.setAllowGravity(false);
    archer.body.updateFromGameObject();
    archer.isArcher = true;
    archer.health = 1;
    archer.shootCD = 0;
    archer.runTimer = 0;
    archer.guardX = null;
    archer.guardWall = null;
    archer.on('animationcomplete', (anim) => {
        if (anim.key === 'archer-attack' && archer.active) {
            archer.play(archer.runTimer > 0 ? 'archer-run' : 'archer-idle', true);
        }
    });
    document.getElementById('archerCount').textContent = archers.countActive();
    document.getElementById('coinCount').textContent = coinBalance;
    playSound('powerup', 0.5);
    resolveArcherPositions();
    assignArcherGuardSlots();
}

function resolveArcherPositions() {
    if (!archers || !walls) return;
    const list = archers.getChildren().filter((a) => a && a.active && a.body && a.body.enable);
    if (!list.length) return;
    const before = list.map((a) => a.x);

    for (let iter = 0; iter < 120; iter++) {
        for (let i = 0; i < list.length; i++) {
            for (let j = i + 1; j < list.length; j++) {
                const a = list[i];
                const b = list[j];
                const dx = b.x - a.x;
                const dist = Math.abs(dx);
                if (dist >= ARCHER_MIN_SPACING) continue;
                const dir = dist < 0.01 ? (i % 2 === 0 ? 1 : -1) : Math.sign(dx);
                const push = (ARCHER_MIN_SPACING - dist) / 2;
                a.x -= push * dir;
                b.x += push * dir;
            }
        }

        walls.children.iterate((w) => {
            if (!w || !w.active || !w.body || !w.body.enable) return;
            const leftLimit = w.body.left - ARCHER_RADIUS - ARCHER_WALL_GAP;
            const rightLimit = w.body.right + ARCHER_RADIUS + ARCHER_WALL_FRONT_GAP;
            list.forEach((a) => {
                if (isArcherMovingToGuard(a)) return;
                if (a.x <= leftLimit || a.x >= rightLimit) return;
                a.x = a.x <= w.body.center.x ? leftLimit : rightLimit;
            });
        });
    }

    list.forEach((a, i) => {
        a.x = Phaser.Math.Clamp(a.x, ARCHER_RADIUS, 2400 - ARCHER_RADIUS);
        const dx = a.x - before[i];
        if (Math.abs(dx) > 0.5) {
            a.runTimer = 300;
            a.setFlipX(dx > 0);
            if (!a.anims.currentAnim || a.anims.currentAnim.key !== 'archer-attack') {
                a.play('archer-run', true);
            }
        }
        if (Math.abs(dx) > 0.01) a.body.updateFromGameObject();
    });
}

function findGuardWall() {
    let guard = null;
    walls.children.iterate((w) => {
        if (!w || !w.active || !w.body || !w.body.enable) return;
        if (!guard || w.body.center.x > guard.body.center.x) guard = w;
    });
    return guard;
}

function isArcherSpotFree(x, ignoredWall) {
    if (x < ARCHER_RADIUS || x > 2400 - ARCHER_RADIUS) return false;
    for (const w of walls.getChildren()) {
        if (!w || !w.active || !w.body || !w.body.enable || w === ignoredWall) continue;
        const leftLimit = w.body.left - ARCHER_RADIUS - ARCHER_WALL_GAP;
        const rightLimit = w.body.right + ARCHER_RADIUS + ARCHER_WALL_FRONT_GAP;
        if (x > leftLimit && x < rightLimit) return false;
    }
    return true;
}

function isArcherMovingToGuard(a) {
    return a && a.guardX !== null && a.guardX !== undefined &&
        Math.abs(a.guardX - a.x) > 0.5;
}

function assignArcherGuardSlots() {
    if (!archers || !walls) return;
    const list = archers.getChildren().filter((a) => a && a.active && a.body && a.body.enable);
    const guardWall = findGuardWall();
    if (!guardWall) {
        list.forEach((a) => {
            a.guardX = null;
            a.guardWall = null;
        });
        return;
    }

    const baseX = guardWall.body.left - ARCHER_RADIUS - ARCHER_WALL_GAP;
    const slots = [];
    for (let x = baseX; slots.length < list.length && x >= ARCHER_RADIUS; x -= ARCHER_MIN_SPACING) {
        if (isArcherSpotFree(x, guardWall)) slots.push(x);
    }

    list.sort((a, b) => b.x - a.x);
    list.forEach((a, i) => {
        a.guardWall = guardWall;
        a.guardX = slots[i] !== undefined ? slots[i] : null;
    });
}

function updateArcherGuardMovement(a, delta) {
    if (!a || !a.active || !a.body || a.guardX === null || a.guardX === undefined) return false;
    const dx = a.guardX - a.x;
    const step = ARCHER_WALK_SPEED * Math.max(0, delta) / 1000;
    if (Math.abs(dx) <= Math.max(step, 0.5)) {
        a.x = a.guardX;
        a.body.updateFromGameObject();
        a.runTimer = 0;
        a.setFlipX(true);
        return false;
    }
    a.x += Math.sign(dx) * step;
    a.body.updateFromGameObject();
    a.runTimer = 300;
    a.setFlipX(dx > 0);
    return true;
}

function buildWall() {
    if (coinBalance < WALL_COST) return;
    if (king.x >= portal.x - 100) return;
    coinBalance -= WALL_COST;
    const w = walls.create(king.x, GROUND_Y - WALL_H / 2, 'wall');
    w.setDepth(DEPTH.PROPS_WALLS + 2);
    w.body.setSize(WALL_W, WALL_H);
    w.body.setAllowGravity(false);
    w.body.setImmovable(true);
    w.refreshBody();
    w.health = WALL_MAX_HEALTH;
    w.maxHealth = WALL_MAX_HEALTH;
    createWallHealthBar(w);
    document.getElementById('coinCount').textContent = coinBalance;
    playSound('build', 0.55);
    resolveArcherPositions();
    assignArcherGuardSlots();
}

function createWallHealthBar(w) {
    const barY = w.y - WALL_H / 2 - 9;
    w.hpBarBg = scene.add.rectangle(w.x, barY, WALL_W + 6, 6, 0x000000).setDepth(DEPTH.UI + 1).setAlpha(0.65);
    w.hpBar = scene.add.rectangle(w.x - WALL_W / 2, barY, WALL_W, 4, 0x44dd44)
        .setDepth(DEPTH.UI + 2).setOrigin(0, 0.5);
    w.hpBarWidth = WALL_W;
}

function updateWallHealthBar(w) {
    if (!w.hpBar) return;
    const ratio = Math.max(0, w.health / w.maxHealth);
    w.hpBar.setSize(w.hpBarWidth * ratio, 4);
    w.hpBar.setFillStyle(ratio > 0.5 ? 0x44dd44 : (ratio > 0.25 ? 0xffcc44 : 0xff5544));
}

function damageWall(w, amount) {
    if (!w || !w.active) return;
    w.health -= amount;
    updateWallHealthBar(w);
    const ratio = Math.max(0, w.health / w.maxHealth);
    w.setTint(Phaser.Display.Color.GetColor(255, Math.round(255 * ratio), Math.round(255 * ratio)));
    if (w.health <= 0) destroyWall(w);
}

function destroyWall(w) {
    if (!w || !w.active) return;
    const wx = w.x, wy = w.y;
    w.body.enable = false;
    if (w.hpBar) { w.hpBar.destroy(); w.hpBarBg.destroy(); w.hpBar = null; w.hpBarBg = null; }
    w.destroy();
    const flash = scene.add.rectangle(wx, wy, WALL_W, WALL_H, 0xffffff).setDepth(DEPTH.FX_LIGHTS);
    scene.tweens.add({ targets: flash, alpha: 0, duration: 200, onComplete: () => flash.destroy() });
    for (let i = 0; i < 6; i++) {
        const chip = scene.add.rectangle(wx + Phaser.Math.Between(-8, 8), wy, 6, 6, 0x8a8a8a).setDepth(DEPTH.FX_LIGHTS - 1);
        scene.tweens.add({
            targets: chip,
            x: chip.x + Phaser.Math.Between(-40, 40),
            y: GROUND_Y - 3,
            angle: Phaser.Math.Between(-180, 180),
            duration: 600,
            ease: 'Quad.easeIn',
            onComplete: () => chip.destroy()
        });
    }
    playSound('hitbig', 0.55);
    assignArcherGuardSlots();
}

function blockingWallFor(enemy) {
    if (!enemy.body) return null;
    let best = null;
    walls.children.iterate((w) => {
        if (!w || !w.active || !w.body || !w.body.enable) return;
        if (enemy.body.left < w.body.left) return;
        if (enemy.body.left - w.body.right > WALL_STANDOFF + 2) return;
        if (!best || w.body.right > best.body.right) best = w;
    });
    return best;
}

function targetVxFor(target) {
    return target.actualVx !== undefined ? target.actualVx : -target.speed;
}

function pointerWorldPos(pointer) {
    return scene.cameras.main.getWorldPoint(pointer.x, pointer.y);
}

function aimFromPointer(pointer) {
    const p = pointerWorldPos(pointer);
    const dx = p.x - king.x;
    const dy = p.y - king.y;
    if (dx * dx + dy * dy >= 16) chargeAngle = Math.atan2(dy, dx);
}

function startCharge(pointer) {
    if (!pointer) return;
    if (charging || gameOver || paused) return;
    if (!king || !king.active) return;
    if (king.shootCD > 0) {
        pendingCharge = true;
        pendingChargePointer = pointer;
        return;
    }
    charging = true;
    chargeStartTime = scene.time.now;
    chargePointerId = pointer.id;
    chargeBellPlayed = false;
    king.shootCD = KING_COOLDOWN;
    aimFromPointer(pointer);
    startChargeSound();
    drawCharge(0, false);
}

function onChargePointerDown(pointer) {
    if (pointer.button !== 0) return;
    startCharge(pointer);
}

document.addEventListener('pointerup', () => {
    if (!charging) {
        pendingCharge = false;
        pendingChargePointer = null;
    }
}, true);

function onChargePointerUp(pointer) {
    if (!charging) return;
    if (pointer && chargePointerId !== null && pointer.id !== chargePointerId) return;
    releaseCharge();
}

function chargeElapsed() {
    return scene.time.now - chargeStartTime;
}

function chargePower(elapsed) {
    return Math.min(Math.max(elapsed / CHARGE_MAX_TIME, 0), 1);
}

function chargeSpeed(power) {
    return CHARGE_MIN_SPEED + (CHARGE_MAX_SPEED - CHARGE_MIN_SPEED) * power;
}

function inCriticalWindow(elapsed) {
    return elapsed >= CHARGE_MAX_TIME && elapsed <= CHARGE_MAX_TIME + CHARGE_CRITICAL_WINDOW;
}

function updateCharge(pointer) {
    aimFromPointer(pointer);
    const elapsed = chargeElapsed();
    const power = chargePower(elapsed);
    const critical = inCriticalWindow(elapsed);
    drawCharge(power, critical);

    if (elapsed >= CHARGE_MAX_TIME) {
        stopChargeSound();
        if (critical && !chargeBellPlayed) {
            chargeBellPlayed = true;
            playCriticalBell();
        }
    } else {
        updateChargeSound(power);
    }
}

function drawCharge(power, critical) {
    const x = king.x;
    const y = STALKER_Y - 52;
    const w = Math.max(0.5, CHARGE_BAR_WIDTH * power);
    const speed = chargeSpeed(power);
    const gravity = PROJECTILE_GRAVITY;
    const color = critical ? 0xffdd44 : 0x66ccff;

    chargeBarBg.setPosition(x, y).setVisible(true);
    chargeBar.setPosition(x - CHARGE_BAR_WIDTH / 2, y).setSize(w, 4)
        .setFillStyle(color).setVisible(true);
    chargeCritLabel.setPosition(x, STALKER_Y - 69).setVisible(critical);
    if (critical) {
        const pulse = 1 + 0.12 * Math.sin(scene.time.now / 45);
        chargeCritLabel.setScale(pulse);
    } else {
        chargeCritLabel.setScale(1);
    }

    const g = chargeAimGfx;
    g.clear();
    const x0 = king.x;
    const y0 = king.y;
    const cos = Math.cos(chargeAngle);
    const sin = Math.sin(chargeAngle);
    g.fillStyle(color, critical ? 0.9 : 0.55);
    for (let t = 0.05; t <= 2; t += 0.05) {
        const px = x0 + cos * speed * t;
        const py = y0 + sin * speed * t + 0.5 * gravity * t * t;
        if (px < -100 || px > 2500) break;
        if (py >= GROUND_Y) {
            g.lineStyle(2, color, 0.6);
            g.strokeCircle(px, GROUND_Y - 2, 4);
            break;
        }
        g.fillCircle(px, py, 1.6);
    }
}

function hideChargeUI() {
    if (chargeAimGfx) chargeAimGfx.clear();
    if (chargeBar) chargeBar.setVisible(false);
    if (chargeBarBg) chargeBarBg.setVisible(false);
    if (chargeCritLabel) chargeCritLabel.setVisible(false);
}

function releaseCharge() {
    if (!charging) return;
    const elapsed = chargeElapsed();
    const power = chargePower(elapsed);
    const critical = inCriticalWindow(elapsed);
    cancelCharge();
    if (gameOver || paused || !king || !king.active) return;
    fireChargedShot(power, critical);
}

function cancelCharge() {
    charging = false;
    chargePointerId = null;
    chargeBellPlayed = false;
    stopChargeSound();
    hideChargeUI();
}

function fireChargedShot(power, critical) {
    const speed = chargeSpeed(power);
    const p = spawnProjectile(king.x, king.y, chargeAngle, king, speed);
    if (!p) return;
    p.damage = critical ? 2 : 1;
    p.critical = critical;
    if (!king.anims.currentAnim || king.anims.currentAnim.key !== 'stalker-attack') {
        king.play('stalker-attack', true);
    }
    playSound('throw', 0.25 + power * 0.2, critical ? 1.25 : 0.85 + power * 0.25);
    if (critical) {
        p.setStrokeStyle(2, 0xffcc33, 1);
        showCriticalBurst(king.x, king.y);
    }
}

function showCriticalBurst(x, y) {
    const ring = scene.add.circle(x, y, 6, 0xffdd44, 0.9).setDepth(7);
    scene.tweens.add({
        targets: ring, scale: 3.2, alpha: 0, duration: 260,
        onComplete: () => ring.destroy()
    });
    const label = scene.add.text(king.x, STALKER_Y - 84, 'КРИТ ×2', {
        fontFamily: 'Arial', fontSize: '16px', color: '#ffdd44',
        stroke: '#000000', strokeThickness: 3
    }).setOrigin(0.5).setDepth(2100);
    scene.tweens.add({
        targets: label, y: label.y - 26, alpha: 0, duration: 750,
        onComplete: () => label.destroy()
    });
}

function startChargeSound() {
    if (!scene || !scene.sound || !scene.sound.context) return;
    stopChargeSound();
    const ctx = scene.sound.context;
    try {
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(520, ctx.currentTime);
        filter.Q.value = 0.8;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.045, ctx.currentTime + 0.08);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(scene.sound.destination || ctx.destination);
        osc.start();
        osc.onended = () => {
            try { osc.disconnect(); filter.disconnect(); gain.disconnect(); } catch (e) {}
        };
        chargeAudio = { osc, filter, gain, ctx };
    } catch (e) {
        chargeAudio = null;
    }
}

function updateChargeSound(power) {
    if (!chargeAudio) return;
    const t = chargeAudio.ctx.currentTime;
    chargeAudio.osc.frequency.setTargetAtTime(140 + power * 500, t, 0.04);
    chargeAudio.filter.frequency.setTargetAtTime(520 + power * 2000, t, 0.04);
    chargeAudio.gain.gain.setTargetAtTime(0.045, t, 0.05);
}

function playCriticalBell() {
    if (!scene || !scene.sound || !scene.sound.context) return;
    const ctx = scene.sound.context;
    const dest = scene.sound.destination || ctx.destination;
    const now = ctx.currentTime;
    const partials = [
        { freq: 1760, gain: 0.10, decay: 0.36 },
        { freq: 2637, gain: 0.055, decay: 0.28 },
        { freq: 3520, gain: 0.03, decay: 0.18 },
        { freq: 880, gain: 0.035, decay: 0.42 }
    ];
    partials.forEach((part) => {
        try {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(part.freq, now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(part.gain, now + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + part.decay);
            osc.connect(gain);
            gain.connect(dest);
            osc.start(now);
            osc.stop(now + part.decay + 0.02);
            osc.onended = () => {
                try { osc.disconnect(); gain.disconnect(); } catch (e) {}
            };
        } catch (e) {}
    });
}

function stopChargeSound() {
    if (!chargeAudio) return;
    const { osc, gain, ctx } = chargeAudio;
    chargeAudio = null;
    try {
        const t = ctx.currentTime;
        gain.gain.cancelScheduledValues(t);
        gain.gain.setTargetAtTime(0.0001, t, 0.015);
        osc.stop(t + 0.08);
    } catch (e) {}
}

function isKingOnGrass() {
    if (!king) return false;
    const feetY = king.y + 32;
    return feetY >= GRASS_TOP && feetY <= GROUND_Y;
}

function updateKingAnimation() {
    if (!king || !king.active || !king.body) return;
    if (king.anims.currentAnim && king.anims.currentAnim.key === 'stalker-attack' && king.anims.isPlaying) return;
    const moving = !!(keyA && keyA.isDown) || !!(keyD && keyD.isDown);
    if (charging && scene.input.activePointer) {
        const p = pointerWorldPos(scene.input.activePointer);
        if (Math.abs(p.x - king.x) > 4) king.setFlipX(p.x < king.x);
    } else if (keyA && keyA.isDown && !(keyD && keyD.isDown)) {
        king.setFlipX(true);
    } else if (keyD && keyD.isDown && !(keyA && keyA.isDown)) {
        king.setFlipX(false);
    }
    const wanted = moving ? 'stalker-walk' : 'stalker-idle';
    if (!king.anims.currentAnim || king.anims.currentAnim.key !== wanted) {
        king.play(wanted, true);
    }
}

function updateArcherAnimation(a, delta) {
    if (!a || !a.active) return;
    if (a.anims.currentAnim && a.anims.currentAnim.key === 'archer-attack' && a.anims.isPlaying) return;
    a.runTimer = Math.max(0, (a.runTimer || 0) - delta);
    if (a.runTimer > 0) {
        if (!a.anims.currentAnim || a.anims.currentAnim.key !== 'archer-run') {
            a.play('archer-run', true);
        }
    } else if (!a.anims.currentAnim || a.anims.currentAnim.key !== 'archer-idle') {
        a.play('archer-idle', true);
    }
}

function update(time, delta) {
    if (typeof waterUpdate === 'function') waterUpdate();
    updateWaterReflection(time);
    try {
        if (gameOver) return;

        if (keyP.isDown && !keyPWasDown) {
            paused = !paused;
            pauseText.setPosition(king.x, king.y - 100).setVisible(paused);
            if (paused) {
                cancelCharge();
                scene.physics.pause();
            } else {
                scene.physics.resume();
            }
        }
        keyPWasDown = keyP.isDown;

        if (paused) return;

        updateFog(delta);

        if (charging) {
            if (!scene.input.activePointer.isDown) releaseCharge();
            else updateCharge(scene.input.activePointer);
        }

        if (king && king.active) {
            king.body.setVelocityX(0);
            if (keyA && keyA.isDown) king.body.setVelocityX(-150);
            else if (keyD && keyD.isDown) king.body.setVelocityX(150);

            king.shootCD = Math.max(0, king.shootCD - delta);
            if (!charging && king.shootCD <= 0 && pendingCharge && pendingChargePointer) {
                const p = pendingChargePointer;
                pendingCharge = false;
                pendingChargePointer = null;
                if (p && p.isDown) {
                    startCharge(p);
                }
            }

            updateKingAnimation();
        }

        resolveArcherPositions();

        archers.children.iterate((a) => {
            if (!a || !a.active) return;
            const movingToGuard = updateArcherGuardMovement(a, delta);
            updateArcherAnimation(a, delta);
            a.shootCD -= delta;
            if (movingToGuard) return;

            const target = findNearestEnemy(a.x, a.y, 500);
            if (target) {
                a.setFlipX(target.x > a.x);
            } else if (a.guardWall) {
                a.setFlipX(true);
            }
            if (a.shootCD <= 0) {
                if (target) {
                    const angle = computeAimAngle(a.x, a.y, target.x, target.y, targetVxFor(target), true);
                    const p = spawnProjectile(a.x, a.y, angle, a);
                    a.shootCD = ARCHER_COOLDOWN;
                    if (p) {
                        a.play('archer-attack', true);
                        playSound('shoot', 0.2);
                    }
                } else {
                    a.shootCD = 200;
                }
            }
        });

        const deadEnemies = [];
        enemies.children.iterate((e) => {
            if (!e || !e.active) return;
            if (e.x < -50) deadEnemies.push(e);

            const blocker = blockingWallFor(e);
            e.body.setVelocityX(blocker ? 0 : -e.speed);
            if (blocker) {
                e.blocker = true;
                e.wallAtk = (e.wallAtk || 0) + delta;
                const blockerCenterX = blocker.body.center.x;
                if (e.wallAtk >= WALL_DAMAGE_INTERVAL) {
                    e.wallAtk -= WALL_DAMAGE_INTERVAL;
                    damageWall(blocker, 1);
                    e.play('enemy-attack', true);
                } else if (!(e.anims.currentAnim &&
                             e.anims.currentAnim.key === 'enemy-attack' &&
                             e.anims.isPlaying)) {
                    if (!e.anims.currentAnim || e.anims.currentAnim.key !== 'enemy-idle') {
                        e.play('enemy-idle', true);
                    }
                }
                e.setFlipX(blockerCenterX < e.x);
            } else {
                e.blocker = false;
                e.wallAtk = 0;
                if (!e.anims.currentAnim || e.anims.currentAnim.key !== 'enemy-run') {
                    e.play('enemy-run', true);
                }
                e.setFlipX(e.body.velocity.x < 0);
            }

            if (e.prevX === undefined) e.prevX = e.x;
            e.actualVx = delta > 0 ? (e.x - e.prevX) / (delta / 1000) : -e.speed;
            e.prevX = e.x;
        });
        deadEnemies.forEach((e) => { e.body.enable = false; e.destroy(); });

        const deadProjectiles = [];
        projectiles.children.iterate((p) => {
            if (!p || !p.active) return;
            if (p.x > 2550 || p.x < -50 || p.y > GROUND_Y) deadProjectiles.push(p);
        });
        deadProjectiles.forEach((p) => {
            if (p.body) p.body.enable = false;
            p.destroy();
        });

        if (time > lastEnemy + 2000) {
            spawnEnemy();
            lastEnemy = time;
        }
    } catch (e) {
        console.error('update error', e);
    }
}

function spawnEnemy() {
    if (enemies.countActive() >= 5) return;
    const type = Phaser.Math.RND.pick([
        { color: 0xffffff, speed: 80, size: 8 },
        { color: 0xc4c4c4, speed: 100, size: 7 },
        { color: 0xe4e4e4, speed: 60, size: 9 }
    ]);
    const e = scene.physics.add.sprite(portal.x - 80, ENEMY_Y, 'enemy');
    e.play('enemy-run');
    e.setFlipX(true);
    e.setDepth(DEPTH.UNITS);
    e.setCircle(type.size, 16 - type.size, 22 - type.size);
    e.setTint(type.color);
    enemies.add(e);
    e.body.setAllowGravity(false);
    e.body.setVelocityX(-type.speed);
    e.speed = type.speed;
    e.health = 2;
    e.prevX = e.x;
    e.actualVx = -type.speed;
    e.blocker = false;
    e.wallAtk = 0;
    e.on('animationcomplete', (anim) => {
        if (!e.active) return;
        if (anim.key === 'enemy-attack') {
            e.play(e.blocker ? 'enemy-idle' : 'enemy-run', true);
        }
    });
}

function hitKing(k, enemy) {
    if (k !== king) return;
    if (!k.active || gameOver) return;
    gameOver = true;
    cancelCharge();
    playSound('stolen', 0.75);

    k.body.enable = false;

    const groundY = GROUND_Y;
    k.setOrigin(0.5, 1);
    k.y = groundY;

    k.play('stalker-death', true);

    k.once('animationcomplete-stalker-death', () => {
        if (k.active) k.destroy();
        showGameOver();
    });

    scene.time.delayedCall(600, () => {
        if (k.active) k.destroy();
        if (document.getElementById('gameOver').style.display !== 'flex') {
            showGameOver();
        }
    });

    scene.physics.pause();
}

function hitArcher(enemy, archer) {
    if (!enemy.active || !archer.active) return;
    archer.health = (archer.health === undefined ? 1 : archer.health) - 1;
    if (archer.health > 0) return;
    archer.body.enable = false;
    archer.destroy();
    document.getElementById('archerCount').textContent = archers.countActive();
    playSound('hitbig', 0.4);
    assignArcherGuardSlots();
}

function showGameOver() {
    const overlay = document.getElementById('gameOver');
    if (!overlay) return;
    overlay.style.display = 'flex';
    overlay.setAttribute('aria-hidden', 'false');
    const btn = document.getElementById('restartBtn');
    if (btn) btn.focus();
}

function hideGameOver() {
    const overlay = document.getElementById('gameOver');
    if (!overlay) return;
    overlay.style.display = 'none';
    overlay.setAttribute('aria-hidden', 'true');
    const btn = document.getElementById('restartBtn');
    if (btn) btn.blur();
}

function restartGame() {
    hideGameOver();
    if (scene && scene.scene) {
        scene.scene.restart();
    }
}

function projectileHitWall(wall, p) {
    killProjectile(p);
    playSound('hitwall', 0.3);
}

function projectileHitEnemy(enemy, p) {
    if (!enemy.active || !p.active) return;
    const damage = p.damage || 1;
    enemy.health -= damage;
    const criticalHit = !!p.critical;
    playSound(criticalHit ? 'die' : 'hit', criticalHit ? 0.6 : 0.35);
    if (enemy.health <= 0) {
        enemy.body.enable = false;
        if (dropCoin(enemy.x)) {
            // coin created
        }
        enemy.destroy();
        if (!criticalHit) playSound('hitbig', 0.5);
    }
    killProjectile(p);
}
